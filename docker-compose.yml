services:
  postgres:
    image: postgres:15
    container_name: camunda-postgres
    environment:
      POSTGRES_DB: camunda
      POSTGRES_USER: camunda
      POSTGRES_PASSWORD: camunda
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  camunda:
    image: camunda/camunda-bpm-platform:latest
    container_name: camunda
    depends_on:
      - postgres
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/camunda
      DB_USERNAME: camunda
      DB_PASSWORD: camunda
    ports:
      - "8081:8080"
    volumes:
      - ./camunda:/camunda/configuration/resources
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: sinac-backend
    environment:
      CAMUNDA_URL: http://camunda:8080
      CAMUNDA_REST_URL: http://camunda:8080/engine-rest
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: camunda
      DB_USER: camunda
      DB_PASSWORD: camunda
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - documentos_media:/app/media
      - ./frontend/src/assets:/app/frontend_assets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  alertas:
    build:
      context: ./backend
    container_name: sinac-alertas
    environment:
      CAMUNDA_URL: http://camunda:8080
      CAMUNDA_REST_URL: http://camunda:8080/engine-rest
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: camunda
      DB_USER: camunda
      DB_PASSWORD: camunda
      TZ: America/Mexico_City
    command: sh -c "while true; do if python manage.py generar_alertas_automatizadas; then sleep 86400; else sleep 60; fi; done"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sinac-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  documentos_media:
