limit_req_zone $binary_remote_addr zone=sinac_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sinac_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=sinac_conn:10m;

map $http_upgrade $sinac_connection_upgrade {
  default "";
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  limit_conn sinac_conn 40;
  limit_req_status 429;
  limit_conn_status 429;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  error_page 502 503 504 /error-servicio.html;

  location ~ /\. {
    deny all;
    return 404;
  }

  location = /api/auth/login/ {
    limit_req zone=sinac_login burst=5 nodelay;
    include /etc/nginx/conf.d/sinac-proxy.inc;
    error_page 502 503 504 = @api_no_disponible;
  }

  location = /api/preregistro/ {
    limit_req zone=sinac_login burst=5 nodelay;
    include /etc/nginx/conf.d/sinac-proxy.inc;
    error_page 502 503 504 = @api_no_disponible;
  }

  location /api/ {
    limit_req zone=sinac_api burst=60 nodelay;
    include /etc/nginx/conf.d/sinac-proxy.inc;
    error_page 502 503 504 = @api_no_disponible;
  }

  location @api_no_disponible {
    default_type application/json;
    charset utf-8;
    return 503 '{"detail":"El servicio no está disponible en este momento. Intenta nuevamente en unos minutos.","codigo":503}';
  }

  location /media/ {
    limit_req zone=sinac_api burst=60 nodelay;
    include /etc/nginx/conf.d/sinac-proxy.inc;
  }

  location = /error-servicio.html {
    internal;
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
